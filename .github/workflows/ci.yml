name: VORTEX-L3 Institutional CI/CD & Linux Binary Publisher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure OpenSSL dev headers
        run: pkg-config --exists openssl || (sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev)

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Gate 1 - Static Linter (Zero Warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Gate 2 - Unit & Integration Test Suite
        run: cargo test --all-targets -- --test-threads=1

      - name: Gate 3 - Build LTO Release Binaries
        run: cargo build --release --bins

      - name: Gate 4 - Execute Pre-Production Binary Gates
        run: |
          ./target/release/vortex_tap
          ./target/release/vortex_replay
          ./target/release/vortex_exec

      - name: Package Certified Linux x86_64 Binaries & COMMIT_SHA
        run: |
          echo "${GITHUB_SHA}" > COMMIT_SHA
          tar -czf vortex-linux-x86_64.tar.gz -C target/release vortex_tap vortex_replay vortex_exec
          sha256sum vortex-linux-x86_64.tar.gz > vortex-linux-x86_64.tar.gz.sha256

      - name: Publish Latest Certified Linux Release Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-linux-x86_64
          name: "VORTEX-L3 Certified Linux x86_64 Binaries (Latest Main)"
          prerelease: false
          files: |
            COMMIT_SHA
            vortex-linux-x86_64.tar.gz
            vortex-linux-x86_64.tar.gz.sha256
