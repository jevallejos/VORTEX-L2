name: VORTEX-OMEGA V5.4.1 Constitutional /dev/shm & 4-Binary LTO Gate
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
jobs:
  constitutional-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Gate 0 - UTF-8 LF Hygiene & Forbidden Artifact Scan
        run: |
          bad=$(find . -maxdepth 3 \( -name "*.mmap" -o -name "*.parquet" -o -name "*.jsonl" -o -name "*.vkl1" -o -name "*.par2z" -o -name ".env" -o \( -name "*.lock" ! -name "Cargo.lock" \) \) | wc -l)
          test "$bad" -eq 0
          ! grep -rnU $'\r' src/ tests/ deploy/ README.md CONSTITUTION_VORTEX_OMEGA.md Cargo.toml
      - name: Gate 1 - Clippy Zero-Warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: Gate 2 - Deterministic /dev/shm Lib (86) & Integration Suites (Red-Team, De-Legacy, V5.4.1 Forensic)
        run: |
          cargo test --lib -- --test-threads=1
          cargo test --tests -- --test-threads=1
      - name: Gate 3 - Build & Verify 4 LTO Fat Binaries + SHA-256
        run: |
          cargo build --release --bins
          ./target/release/vortex_tap
          mkdir -p /tmp/vortex_ci_par2_gate
          ./target/release/vortex_replay --dir /tmp/vortex_ci_par2_gate
          rmdir /tmp/vortex_ci_par2_gate
          ./target/release/vortex_exec
          ./target/release/vortex_web
          sha256sum target/release/vortex_tap target/release/vortex_replay target/release/vortex_exec target/release/vortex_web
