name: VORTEX-L3 Institutional CI & LTO Release Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vortex-l3-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  certify-and-package-linux-x86_64:
    name: 4-Gate LTO Certification (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSSL and pkg-config headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust stable toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Gate 1 - Strict Static Linter (Zero Warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Gate 2 - Full Unit and Counterfactual Test Suite
        run: cargo test --all-targets -- --nocapture

      - name: Gate 3 - Institutional Release Build (Fat LTO, Panic Abort)
        run: cargo build --release --bins

      - name: Gate 4 - Binary Self-Certification (Tap + Replay + OOS 520)
        run: |
          ./target/release/vortex_tap
          ./target/release/vortex_replay
          ./target/release/vortex_exec

      - name: Seal COMMIT_SHA, Tarball and SHA256SUMS
        run: |
          rm -rf dist
          mkdir -p dist
          git rev-parse HEAD > dist/COMMIT_SHA
          cp dist/COMMIT_SHA ./COMMIT_SHA
          cp target/release/vortex_tap dist/
          cp target/release/vortex_replay dist/
          cp target/release/vortex_exec dist/
          chmod +x dist/vortex_tap dist/vortex_replay dist/vortex_exec
          tar -czf vortex-linux-x86_64.tar.gz -C dist \
            vortex_tap vortex_replay vortex_exec COMMIT_SHA
          sha256sum vortex-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload Certified Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-rs-linux-x86_64
          path: |
            vortex-linux-x86_64.tar.gz
            COMMIT_SHA
            SHA256SUMS
          if-no-files-found: error

      - name: Publish SHA-Locked Assets to Release latest-linux-x86_64
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-linux-x86_64"
          SHA="$(cat COMMIT_SHA)"
          NOTES="Certified VORTEX-L3 Linux x86_64 LTO build for commit ${SHA}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              vortex-linux-x86_64.tar.gz COMMIT_SHA SHA256SUMS --clobber
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" \
              vortex-linux-x86_64.tar.gz COMMIT_SHA SHA256SUMS \
              --title "VORTEX-L3 Latest Certified Linux x86_64" \
              --notes "${NOTES}"
          fi
