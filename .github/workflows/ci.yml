name: VORTEX-L3 Institutional CI Gate (SHM v13)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-x86_64-institutional-gate:
    name: Ubuntu x86_64 Clippy + 38 Tests + 3 LTO Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSSL & pkg-config headers for Linux TLS/WS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust stable toolchain with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2

      - name: Static Pedantic Audit (Linux cfg active, zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unified Deterministic Test Suite (38 tests, single-threaded SHM)
        run: cargo test -- --test-threads=1

      - name: Compile LTO Fat Release Binaries
        run: cargo build --release --bins

      - name: Execute Native Linux Gate 1 (vortex_tap SHM v13 + PAR1)
        run: ./target/release/vortex_tap

      - name: Execute Native Linux Gate 2 (vortex_replay 200k FIFO + A/B/A+B)
        run: ./target/release/vortex_replay

      - name: Execute Native Linux Gate 3 (vortex_exec OOS 520 + Zero Drift)
        run: ./target/release/vortex_exec
