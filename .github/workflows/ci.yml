name: VORTEX-OMEGA Institutional CI Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  ubuntu-institutional-gate:
    name: Ubuntu x86_64 SHM v13, 49-Test & LTO Fat Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (LF preserved)
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Stage 1a — Secret, Lockfile & CRLF Hygiene Audit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^\.env|\.env\.|HALTED_ON_LOSS\.lock|DRAIN_MODE\.lock|\.pdb$|\.mmap$)'; then
            echo "::error::Forbidden secret, runtime lock, or binary artifact tracked in Git!"
            exit 1
          fi
          if grep -rnU $'\r' src/ Cargo.toml CONSTITUTION_VORTEX_OMEGA.md .github/workflows/ci.yml; then
            echo "::error::CRLF line endings detected; repository mandates strict UTF-8 LF."
            exit 1
          fi
          echo "[OK] Zero tracked secrets/locks and 100% pure LF verified."

      - name: Stage 1b — Zero-Warning Clippy Static Analysis
        run: cargo clippy --all-targets -- -D warnings

      - name: Stage 2 — Deterministic 49-Test Suite (POSIX /dev/shm + Scar Lab + OOS 520)
        run: cargo test --lib --bins -- --test-threads=1

      - name: Stage 3a — Build LTO Fat Release Binaries
        run: cargo build --release --bins

      - name: Stage 3b — Execute Linux Release CLI Certification Gates
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/vortex_replay
          ./target/release/vortex_exec
          mkdir -p dist-omega
          cp target/release/vortex_tap target/release/vortex_replay target/release/vortex_exec CONSTITUTION_VORTEX_OMEGA.md dist-omega/
          (cd dist-omega && sha256sum vortex_tap vortex_replay vortex_exec CONSTITUTION_VORTEX_OMEGA.md > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload Immutable Linux x86_64 Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: vortex-omega-v4-linux-x86_64
          path: dist-omega/
          if-no-files-found: error
          retention-days: 30
