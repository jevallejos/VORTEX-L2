name: VORTEX-OMEGA V4.4 Institutional CI & SHA256 Release Gate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "vortex-*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify-and-package-linux-x86_64:
    name: Gate 1-4 (Clippy Pedantic, 58-Test Suite, Fat-LTO & OOS 520)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenSSL Headers for Native-TLS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev python3

      - name: Install Rust Toolchain (1.88+)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: "Gate 1: Strict Static Linter (Clippy Pedantic Zero-Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Gate 2: Deterministic Unit & Forensic Shield Suite"
        run: cargo test --lib -- --test-threads=1

      - name: "Gate 3: Fat-LTO Release Binary Compilation"
        run: cargo build --release --bins

      - name: "Gate 4: Live Binary Certification (Tap 12-Slot + FIFO Replay + OOS 520)"
        run: |
          python3 -m py_compile deploy/prewarm_emas_bybit.py
          ./target/release/vortex_tap
          mkdir -p /tmp/vortex_empty_par1_gate
          ./target/release/vortex_replay --dir /tmp/vortex_empty_par1_gate
          ./target/release/vortex_exec

      - name: Package SHA256-Locked Artifact Bundle
        run: |
          mkdir -p dist_inner release_out
          git rev-parse HEAD > dist_inner/COMMIT_SHA
          cp target/release/vortex_tap dist_inner/
          cp target/release/vortex_replay dist_inner/
          cp target/release/vortex_exec dist_inner/
          chmod +x dist_inner/vortex_tap dist_inner/vortex_replay dist_inner/vortex_exec
          tar -czf release_out/vortex-linux-x86_64.tar.gz \
            -C dist_inner vortex_tap vortex_replay vortex_exec COMMIT_SHA
          cp dist_inner/COMMIT_SHA release_out/COMMIT_SHA
          (cd release_out && sha256sum vortex-linux-x86_64.tar.gz > SHA256SUMS)
          (cd release_out && sha256sum -c SHA256SUMS)

      - name: Upload CI Artifact (vortex-rs-linux-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: vortex-rs-linux-x86_64
          path: |
            release_out/vortex-linux-x86_64.tar.gz
            release_out/COMMIT_SHA
            release_out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish Rolling SHA-Locked Release (latest-linux-x86_64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest-linux-x86_64"
          HEAD_SHA="$(cat release_out/COMMIT_SHA)"
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --title "VORTEX-OMEGA V4.4 Rolling Production Binary (Linux x86_64)" \
              --notes "Automated SHA256-locked build for commit ${HEAD_SHA}" \
              --target "${HEAD_SHA}"
          fi
          gh release upload "${TAG_NAME}" \
            release_out/vortex-linux-x86_64.tar.gz \
            release_out/COMMIT_SHA \
            release_out/SHA256SUMS \
            --clobber
          gh release edit "${TAG_NAME}" \
            --notes "Automated SHA256-locked build for commit ${HEAD_SHA}" \
            --target "${HEAD_SHA}"
