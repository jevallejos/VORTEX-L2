name: VORTEX-OMEGA Institutional CI Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: write

jobs:
  ubuntu-institutional-gate:
    name: Ubuntu x86_64 SHM v13, 53-Test & LTO Fat Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (LF preserved)
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Stage 1a - Secret, Lockfile & CRLF Hygiene Audit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^\.env|\.env\.|HALTED_ON_LOSS\.lock|DRAIN_MODE\.lock|\.pdb$|\.mmap$)'; then
            echo "::error::Forbidden secret, runtime lock, or binary artifact tracked in Git!"
            exit 1
          fi
          if grep -rnU $'\r' src/ Cargo.toml CONSTITUTION_VORTEX_OMEGA.md README.md deploy/ .github/workflows/ci.yml; then
            echo "::error::CRLF line endings detected; repository mandates strict UTF-8 LF."
            exit 1
          fi
          echo "[OK] Zero tracked secrets/locks and 100% pure LF verified."

      - name: Stage 1b - Zero-Warning Clippy Static Analysis
        run: cargo clippy --all-targets -- -D warnings

      - name: Stage 2 - Deterministic 53-Test Suite (POSIX /dev/shm + Scar Lab + OOS 520 + V4.1)
        run: cargo test --lib --bins -- --test-threads=1

      - name: Stage 3a - Build LTO Fat Release Binaries
        run: cargo build --release --bins

      - name: Stage 3b - Execute Linux CLI Certification Gates & Package SHA256 Tarball
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/vortex_tap
          mkdir -p /tmp/vortex_empty_par1_gate
          ./target/release/vortex_replay --dir /tmp/vortex_empty_par1_gate
          rmdir /tmp/vortex_empty_par1_gate
          ./target/release/vortex_exec
          mkdir -p dist-omega/bundle
          cp target/release/vortex_tap target/release/vortex_replay target/release/vortex_exec dist-omega/bundle/
          cp CONSTITUTION_VORTEX_OMEGA.md README.md dist-omega/bundle/
          git rev-parse HEAD > dist-omega/bundle/COMMIT_SHA
          cp dist-omega/bundle/COMMIT_SHA dist-omega/COMMIT_SHA
          tar -czf dist-omega/vortex-linux-x86_64.tar.gz -C dist-omega/bundle .
          rm -rf dist-omega/bundle
          (cd dist-omega && sha256sum vortex-linux-x86_64.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Upload Immutable Linux x86_64 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-omega-v41-linux-x86_64
          path: dist-omega/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Rolling SHA256-Locked Release (latest-linux-x86_64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-linux-x86_64"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist-omega/vortex-linux-x86_64.tar.gz dist-omega/COMMIT_SHA dist-omega/SHA256SUMS --title "VORTEX-OMEGA V4.1 Rolling Linux x86_64" --notes "SHA256-locked LTO Fat bundle for sniper-singapur."
          else
            gh release upload "$TAG" dist-omega/vortex-linux-x86_64.tar.gz dist-omega/COMMIT_SHA dist-omega/SHA256SUMS --clobber
          fi
